<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Eureka Lite - Innovation Practice for the AI Era</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles (v=i18n6 - cache bust) -->
  <link rel="stylesheet" href="css/base.css?v=i18n13">
  <link rel="stylesheet" href="css/components.css?v=i18n13">
  <link rel="stylesheet" href="css/home.css?v=i18n13">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23E07A2F' rx='20' width='100' height='100'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>E</text></svg>">

  <style>
    /* Additional screen-specific styles */
    .screen-content {
      max-width: 100%;
    }

    .screen-title {
      font-size: var(--font-size-2xl);
      font-weight: 600;
      margin-bottom: var(--space-xs);
      color: var(--text-primary);
    }

    .screen-subtitle {
      font-size: var(--font-size-base);
      color: var(--text-secondary);
      margin-bottom: var(--space-lg);
    }

    .screen-hint {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      padding: var(--space-md);
      background: var(--module-accent, rgba(224, 122, 47, 0.1));
      border-radius: var(--radius-md);
      margin-bottom: var(--space-lg);
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }

    .hint-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .screen-form {
      background: var(--bg-card);
      padding: var(--space-lg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .nco-cards {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .nco-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      transition: all var(--transition-fast);
    }

    .nco-card:hover {
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    .nco-card-type {
      display: inline-block;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: white;
      margin-bottom: var(--space-sm);
    }

    .nco-card-title {
      font-size: var(--font-size-base);
      font-weight: 500;
      margin-bottom: var(--space-xs);
    }

    .nco-card-desc {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-sm);
    }

    .nco-card-source {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
    }

    /* Profile styles */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-xl) 0;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--reveal-primary), var(--inspire-primary));
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: var(--space-md);
    }

    .profile-name {
      font-size: var(--font-size-xl);
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }

    .profile-sub {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }

    .profile-stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      text-align: center;
    }

    .profile-stat-value {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--reveal-primary);
    }

    .profile-stat-label {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-top: var(--space-xs);
    }

    .profile-progress {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-xl);
    }

    .profile-menu {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .profile-menu-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .profile-menu-item:hover {
      background: var(--bg-hover);
    }

    .profile-menu-item:not(:last-child) {
      border-bottom: 1px solid var(--border-color);
    }

    .profile-menu-icon {
      font-size: 20px;
    }

    .profile-menu-item span:nth-child(2) {
      flex: 1;
    }

    .profile-menu-arrow {
      color: var(--text-muted);
    }

    /* Project styles */
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .project-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .project-card:hover {
      background: var(--bg-hover);
    }

    .project-card-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .project-card-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .project-card-info {
      flex: 1;
      min-width: 0;
    }

    .project-card-title {
      font-size: var(--font-size-base);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-card-meta {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-top: var(--space-xs);
    }

    /* Module main content */
    .module-main {
      min-height: 100vh;
    }

    .module-content {
      animation: fadeIn var(--transition-normal) ease;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- App content rendered by JavaScript -->
  </div>

  <!-- Scripts (v=i18n3 - cache bust) -->
  <script src="js/storage.js?v=i18n13"></script>
  <script src="js/state.js?v=i18n13"></script>
  <script src="js/utils.js?v=i18n13"></script>
  <!-- AI config (ai-config.js is gitignored; falls back gracefully if missing) -->
  <script src="js/ai-config.js?v=i18n13"></script>
  <script src="js/voice-iat.js?v=i18n13"></script>
  <script src="js/ai-service.js?v=i18n13"></script>
  <script src="js/ai-assistant.js?v=i18n13"></script>
  <!-- English build: open in English by default (no manual toggle needed) -->
  <script>window.__I18N_DEFAULT__ = 'en';</script>
  <script src="js/i18n.js?v=i18n13"></script>
  <script src="js/app.js?v=i18n13"></script>
</body>
</html>
