<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4F46E5" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="760" height="1120" fill="#EDEFF8"/>
  <rect x="22" y="22" width="716" height="1074" rx="20" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="22" y="22" width="716" height="48" rx="20" fill="#F4F5FB"/>
  <rect x="22" y="54" width="716" height="16" fill="#F4F5FB"/>
  <circle cx="50" cy="46" r="6" fill="#FF5F57"/><circle cx="72" cy="46" r="6" fill="#FEBC2E"/><circle cx="94" cy="46" r="6" fill="#28C840"/>
  <text x="150" y="50" font-size="12" fill="#9AA0B4">eureka-lite · 项目全景图</text>

  <!-- header -->
  <g transform="translate(0,70)">
    <circle cx="64" cy="34" r="18" fill="url(#brand)"/><text x="64" y="40" font-size="18" fill="#fff" text-anchor="middle">✦</text>
    <text x="94" y="42" font-size="20" font-weight="800" fill="#1F2233">🎉 项目全景图</text>
    <text x="700" y="42" font-size="13" fill="#6B7280" text-anchor="end">MOMOS · 完整 RISE 旅程</text>
  </g>

  <!-- Reveal -->
  <g transform="translate(48,128)">
    <rect width="664" height="150" rx="16" fill="#F8F9FF" stroke="#E6E8F4"/>
    <rect x="0" y="0" width="6" height="150" rx="3" fill="#4F46E5"/>
    <text x="22" y="30" font-size="15" font-weight="700" fill="#1F2233">🔍 揭示了什么 · Reveal</text>
    <text x="22" y="58" font-size="12.5" fill="#6B7280">目标用户：加班又想喝够水的年轻上班族</text>
    <text x="22" y="82" font-size="12.5" fill="#6B7280">场景：工位上忙到忘记喝水</text>
    <text x="22" y="106" font-size="12.5" fill="#374151">核心洞察：不是忘了喝，是「没空想起来」</text>
    <text x="22" y="130" font-size="12.5" fill="#374151">商业假设：提醒 + 记录能养成喝水习惯</text>
  </g>

  <!-- Inspire -->
  <g transform="translate(48,294)">
    <rect width="664" height="118" rx="16" fill="#F8F9FF" stroke="#E6E8F4"/>
    <rect x="0" y="0" width="6" height="118" rx="3" fill="#7C3AED"/>
    <text x="22" y="30" font-size="15" font-weight="700" fill="#1F2233">💡 启发了什么 · Inspire</text>
    <text x="22" y="58" font-size="12.5" fill="#374151">最佳 HMW：如何让补水变成「顺手」的事？</text>
    <text x="22" y="84" font-size="12.5" fill="#374151">最佳创意：会轻拍提醒的智能杯盖 · 温感进度环 · App 打卡</text>
    <text x="22" y="108" font-size="12.5" fill="#6B7280">评分 Top3 已选出，进入构建</text>
  </g>

  <!-- Shape -->
  <g transform="translate(48,428)">
    <rect width="664" height="150" rx="16" fill="#F8F9FF" stroke="#E6E8F4"/>
    <rect x="0" y="0" width="6" height="150" rx="3" fill="#4F46E5"/>
    <text x="22" y="30" font-size="15" font-weight="700" fill="#1F2233">🎯 构建了什么 · Shape</text>
    <text x="22" y="58" font-size="12.5" fill="#374151">概念方案：MOMOS — 会提醒、能记录的智能补水杯盖</text>
    <text x="22" y="82" font-size="12.5" fill="#6B7280">功能：智能杯盖 · 温感进度环 · App 同步</text>
    <text x="22" y="106" font-size="12.5" fill="#6B7280">用户故事：6 格故事板（问题→机会→接触→使用→结果→感受）</text>
    <text x="22" y="130" font-size="12.5" fill="#9AA0B4">边界：不做医疗诊断，首版只做提醒+记录</text>
  </g>

  <!-- Exam -->
  <g transform="translate(48,594)">
    <rect width="664" height="244" rx="16" fill="#F8F9FF" stroke="#E6E8F4"/>
    <rect x="0" y="0" width="6" height="244" rx="3" fill="#7C3AED"/>
    <text x="22" y="30" font-size="15" font-weight="700" fill="#1F2233">📋 验证了什么 · Exam</text>
    <text x="22" y="58" font-size="12.5" fill="#6B7280">测试目的：提醒方式是否真能让人多喝水的</text>
    <text x="22" y="84" font-size="12.5" fill="#374151">有效价值：轻拍提醒比 App 弹窗更管用</text>
    <text x="22" y="108" font-size="12.5" fill="#374151">新问题：长时间会议仍会忽略提醒</text>
    <text x="22" y="134" font-size="12.5" fill="#374151">四维度评价：</text>
    <rect x="150" y="120" width="120" height="22" rx="11" fill="#7C3AED"/><text x="210" y="135" font-size="11" fill="#fff" text-anchor="middle">综合 17 / 20</text>
    <text x="290" y="135" font-size="11.5" fill="#6B7280">用户价值 5 · 商业 4 · 技术 4 · 创新 4</text>
    <text x="22" y="166" font-size="12.5" fill="#374151">电梯演讲：</text>
    <text x="22" y="188" font-size="12" fill="#374151">"MOMOS 为忙到忘记喝水的上班族，提供会提醒、</text>
    <text x="22" y="208" font-size="12" fill="#374151">能记录的智能杯盖，把补水变成顺手的小事。"</text>
    <text x="22" y="234" font-size="12.5" fill="#6B7280">30-60-90：30天原型 → 60天内测 → 90天小批量</text>
  </g>

  <!-- toolbar -->
  <g transform="translate(48,860)">
    <rect width="156" height="40" rx="20" fill="#EEF0FF"/><text x="126" y="65" font-size="13" fill="#4F46E5" text-anchor="middle">🖼️ 存为图片</text>
    <rect x="170" width="156" height="40" rx="20" fill="#EEF0FF"/><text x="248" y="65" font-size="13" fill="#4F46E5" text-anchor="middle">📥 下载 HTML</text>
    <rect x="340" width="156" height="40" rx="20" fill="#EEF0FF"/><text x="418" y="65" font-size="13" fill="#4F46E5" text-anchor="middle">🖨️ 打印 / PDF</text>
    <rect x="510" width="154" height="40" rx="20" fill="url(#brand)"/><text x="587" y="65" font-size="13" fill="#fff" text-anchor="middle">返回首页</text>
  </g>

  <text x="380" y="970" font-size="12" fill="#9AA0B4" text-anchor="middle">一页看懂整个项目，发给老板 / 投资人 / 队友都够用 ✅</text>
</svg>
