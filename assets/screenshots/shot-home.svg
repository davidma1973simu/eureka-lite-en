<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/><stop offset="1" stop-color="#F6EDFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4F46E5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- page bg -->
  <rect x="0" y="0" width="760" height="980" fill="#EDEFF8"/>

  <!-- browser window -->
  <rect x="22" y="22" width="716" height="936" rx="20" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="22" y="22" width="716" height="48" rx="20" fill="#F4F5FB"/>
  <rect x="22" y="54" width="716" height="16" fill="#F4F5FB"/>
  <circle cx="50" cy="46" r="6" fill="#FF5F57"/><circle cx="72" cy="46" r="6" fill="#FEBC2E"/><circle cx="94" cy="46" r="6" fill="#28C840"/>
  <rect x="150" y="36" width="430" height="20" rx="10" fill="#FFFFFF" stroke="#E2E5F0"/>
  <text x="170" y="50" font-size="12" fill="#9AA0B4">eureka-lite · 轻量 AI 创新工作台</text>

  <!-- app header -->
  <g transform="translate(0,70)">
    <circle cx="64" cy="36" r="18" fill="url(#brand)"/>
    <text x="64" y="42" font-size="18" fill="#fff" text-anchor="middle">✦</text>
    <text x="94" y="43" font-size="20" font-weight="700" fill="#1F2233">Eureka Lite</text>
    <!-- lang toggle -->
    <rect x="540" y="22" width="62" height="28" rx="14" fill="#EEF0FF"/>
    <circle cx="572" cy="36" r="11" fill="#4F46E5"/>
    <text x="589" y="40" font-size="11" fill="#fff">中</text>
    <text x="551" y="40" font-size="11" fill="#9AA0B4">EN</text>
    <!-- AI button -->
    <rect x="614" y="20" width="108" height="32" rx="16" fill="url(#brand)"/>
    <text x="668" y="40" font-size="13" fill="#fff" text-anchor="middle">⚙ AI 助手</text>
  </g>

  <!-- hero -->
  <g transform="translate(0,140)">
    <rect x="48" y="14" width="664" height="180" rx="20" fill="url(#hero)"/>
    <rect x="48" y="14" width="6" height="180" rx="3" fill="url(#brand)"/>
    <text x="80" y="66" font-size="30" font-weight="800" fill="#1F2233">把「我觉得」变成</text>
    <text x="80" y="106" font-size="30" font-weight="800" fill="#4F46E5">「我验证过」的好点子</text>
    <text x="80" y="142" font-size="14" fill="#6B7280">轻量 · AI 驱动的创新工作台 · 打开网页就能用，无需注册</text>
    <rect x="80" y="158" width="148" height="36" rx="18" fill="url(#brand)"/>
    <text x="154" y="181" font-size="14" fill="#fff" text-anchor="middle">＋ 开始新项目</text>
    <rect x="240" y="158" width="170" height="36" rx="18" fill="#fff" stroke="#4F46E5"/>
    <text x="325" y="181" font-size="14" fill="#4F46E5" text-anchor="middle">试一试示例项目</text>
  </g>

  <!-- RISE stage cards -->
  <g transform="translate(0,348)">
    <text x="48" y="0" font-size="15" font-weight="700" fill="#1F2233">RISE 四步创新法</text>
    <!-- card 1 -->
    <g transform="translate(48,16)">
      <rect width="156" height="118" rx="16" fill="#fff" stroke="#E6E8F4"/>
      <text x="18" y="34" font-size="22">🔍</text>
      <text x="18" y="62" font-size="16" font-weight="700" fill="#1F2233">揭示 Reveal</text>
      <text x="18" y="84" font-size="11.5" fill="#6B7280">发现真实问题</text>
      <text x="18" y="100" font-size="11.5" fill="#9AA0B4">用户 · 痛点 · 洞察</text>
    </g>
    <g transform="translate(216,16)">
      <rect width="156" height="118" rx="16" fill="#fff" stroke="#E6E8F4"/>
      <text x="18" y="34" font-size="22">💡</text>
      <text x="18" y="62" font-size="16" font-weight="700" fill="#1F2233">启发 Inspire</text>
      <text x="18" y="84" font-size="11.5" fill="#6B7280">重构并生成创意</text>
      <text x="18" y="100" font-size="11.5" fill="#9AA0B4">HMW · 创意评分</text>
    </g>
    <g transform="translate(384,16)">
      <rect width="156" height="118" rx="16" fill="#fff" stroke="#E6E8F4"/>
      <text x="18" y="34" font-size="22">🎯</text>
      <text x="18" y="62" font-size="16" font-weight="700" fill="#1F2233">构建 Shape</text>
      <text x="18" y="84" font-size="11.5" fill="#6B7280">做成可测概念</text>
      <text x="18" y="100" font-size="11.5" fill="#9AA0B4">概念卡 · 故事板</text>
    </g>
    <g transform="translate(552,16)">
      <rect width="156" height="118" rx="16" fill="#fff" stroke="#E6E8F4"/>
      <text x="18" y="34" font-size="22">📋</text>
      <text x="18" y="62" font-size="16" font-weight="700" fill="#1F2233">验证 Exam</text>
      <text x="18" y="84" font-size="11.5" fill="#6B7280">动手验证再开做</text>
      <text x="18" y="100" font-size="11.5" fill="#9AA0B4">测试 · 电梯演讲</text>
    </g>
  </g>

  <!-- example project -->
  <g transform="translate(0,540)">
    <rect x="48" y="8" width="664" height="96" rx="18" fill="#fff" stroke="#E6E8F4" filter="url(#sh)"/>
    <rect x="48" y="8" width="6" height="96" rx="3" fill="#7C3AED"/>
    <text x="80" y="40" font-size="14" fill="#7C3AED" font-weight="700">示例项目</text>
    <text x="80" y="66" font-size="17" font-weight="700" fill="#1F2233">MOMOS · 智能补水水杯</text>
    <text x="80" y="88" font-size="12.5" fill="#6B7280">跟着完整 RISE 流程走一遍，第一次用也能秒懂</text>
    <rect x="600" y="40" width="86" height="34" rx="17" fill="#7C3AED"/>
    <text x="643" y="62" font-size="13" fill="#fff" text-anchor="middle">打开看看</text>
  </g>

  <!-- AI hint chip -->
  <g transform="translate(0,660)">
    <rect x="48" y="10" width="664" height="56" rx="16" fill="#F4F1FF"/>
    <text x="74" y="43" font-size="13" fill="#5B21B6">✨ AI 助手全程陪跑：帮你头脑风暴、挑刺、查资料，每个阶段都能叫它</text>
  </g>

  <!-- footer -->
  <text x="380" y="876" font-size="12" fill="#9AA0B4" text-anchor="middle">本地保存 · 无需注册 · 完全免费 · 数据只存在你浏览器里</text>
</svg>
