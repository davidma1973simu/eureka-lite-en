<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="760" height="980" fill="#EDEFF8"/>
  <rect x="22" y="22" width="716" height="936" rx="20" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="22" y="22" width="716" height="48" rx="20" fill="#F4F5FB"/>
  <rect x="22" y="54" width="716" height="16" fill="#F4F5FB"/>
  <circle cx="50" cy="46" r="6" fill="#FF5F57"/><circle cx="72" cy="46" r="6" fill="#FEBC2E"/><circle cx="94" cy="46" r="6" fill="#28C840"/>
  <text x="150" y="50" font-size="12" fill="#9AA0B4">eureka-lite · 启发 Inspire</text>

  <!-- header -->
  <g transform="translate(0,70)">
    <circle cx="64" cy="36" r="18" fill="url(#brand)"/><text x="64" y="42" font-size="18" fill="#fff" text-anchor="middle">✦</text>
    <text x="94" y="43" font-size="20" font-weight="700" fill="#1F2233">Eureka Lite</text>
    <rect x="614" y="20" width="108" height="32" rx="16" fill="url(#brand)"/><text x="668" y="40" font-size="13" fill="#fff" text-anchor="middle">⚙ AI 助手</text>
  </g>

  <!-- stage progress -->
  <g transform="translate(48,140)">
    <rect width="160" height="30" rx="15" fill="#E8EAF6"/><text x="80" y="20" font-size="12" fill="#9AA0B4" text-anchor="middle">① 揭示</text>
    <rect x="172" width="160" height="30" rx="15" fill="url(#brand)"/><text x="252" y="20" font-size="12" fill="#fff" text-anchor="middle">② 启发</text>
    <rect x="344" width="160" height="30" rx="15" fill="#E8EAF6"/><text x="424" y="20" font-size="12" fill="#9AA0B4" text-anchor="middle">③ 构建</text>
    <rect x="516" width="160" height="30" rx="15" fill="#E8EAF6"/><text x="596" y="20" font-size="12" fill="#9AA0B4" text-anchor="middle">④ 验证</text>
  </g>

  <!-- left: POV + HMW -->
  <g transform="translate(48,196)">
    <rect width="356" height="300" rx="16" fill="#fff" stroke="#E6E8F4"/>
    <rect x="0" y="0" width="6" height="300" rx="3" fill="#4F46E5"/>
    <text x="22" y="34" font-size="15" font-weight="700" fill="#1F2233">观点 POV</text>
    <text x="22" y="62" font-size="12.5" fill="#6B7280">目标用户</text>
    <text x="22" y="82" font-size="13" fill="#1F2233">加班又想喝够水的年轻上班族</text>
    <text x="22" y="112" font-size="12.5" fill="#6B7280">核心洞察</text>
    <text x="22" y="132" font-size="13" fill="#1F2233">不是忘了喝水，是「没空想起来」</text>
    <text x="22" y="170" font-size="12.5" fill="#6B7280">HMW 重构提问</text>
    <text x="22" y="194" font-size="13" fill="#1F2233">· 如何让人「顺手」就喝到水？</text>
    <text x="22" y="216" font-size="13" fill="#1F2233">· 如何让补水变成一种提醒？</text>
    <text x="22" y="238" font-size="13" fill="#1F2233">· 如何把水杯变成健康伙伴？</text>
    <rect x="22" y="258" width="150" height="30" rx="15" fill="#EEF0FF"/><text x="97" y="278" font-size="12.5" fill="#4F46E5" text-anchor="middle">✨ AI 生成 HMW</text>
  </g>

  <!-- right: AI panel -->
  <g transform="translate(420,196)">
    <rect width="292" height="640" rx="16" fill="#0F1226"/>
    <text x="22" y="36" font-size="15" font-weight="700" fill="#fff">AI 助手</text>
    <rect x="22" y="52" width="84" height="26" rx="13" fill="#4F46E5"/><text x="64" y="69" font-size="11" fill="#fff" text-anchor="middle">头脑风暴</text>
    <rect x="114" y="52" width="70" height="26" rx="13" fill="#2A2E4A"/><text x="149" y="69" font-size="11" fill="#C7CBE0" text-anchor="middle">批判</text>
    <rect x="192" y="52" width="78" height="26" rx="13" fill="#2A2E4A"/><text x="231" y="69" font-size="11" fill="#C7CBE0" text-anchor="middle">查资料</text>

    <!-- user bubble -->
    <rect x="120" y="100" width="156" height="34" rx="14" fill="#4F46E5"/>
    <text x="138" y="122" font-size="11.5" fill="#fff">帮我想几个产品创意</text>
    <!-- ai bubble -->
    <rect x="22" y="148" width="248" height="250" rx="14" fill="#1B1F3B"/>
    <text x="40" y="176" font-size="12.5" fill="#A9B0FF" font-weight="700">Eureka · 灵感</text>
    <text x="40" y="204" font-size="12" fill="#E5E7F5">1. 会「轻拍提醒」的智能杯盖</text>
    <text x="40" y="228" font-size="12" fill="#E5E7F5">2. 喝水进度可视的温感杯壁</text>
    <text x="40" y="252" font-size="12" fill="#E5E7F5">3. 连 App 的「补水打卡」社交</text>
    <text x="40" y="276" font-size="12" fill="#E5E7F5">4. 按作息自动控温的随行杯</text>
    <text x="40" y="300" font-size="12" fill="#E5E7F5">5. 办公室「接力喝水」小游戏</text>
    <text x="40" y="332" font-size="11.5" fill="#8A90B8">👍 哪几个想深挖？我帮你打分</text>
    <text x="40" y="360" font-size="11.5" fill="#8A90B8">或要我按四维度评一评？</text>

    <rect x="22" y="416" width="248" height="38" rx="12" fill="#15182F" stroke="#2A2E4A"/>
    <text x="40" y="440" font-size="11.5" fill="#6B7099">输入你的想法…</text>
    <text x="240" y="440" font-size="14" fill="#4F46E5">➤</text>

    <rect x="22" y="470" width="248" height="36" rx="12" fill="#4F46E5"/>
    <text x="146" y="493" font-size="13" fill="#fff" text-anchor="middle">⚡ 一键生成创意并评分</text>
  </g>

  <!-- bottom hint -->
  <g transform="translate(48,860)">
    <rect width="356" height="48" rx="14" fill="#F4F1FF"/>
    <text x="22" y="30" font-size="12" fill="#5B21B6">💡 强制联想：把问题丢给遥远领域，撞出意想不到的组合</text>
  </g>
</svg>
